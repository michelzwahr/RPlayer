[package]
name = "rplayer"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15.7"
rspotify = { version = "0.16", features = ["cli"] }
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
crossterm = { version = "0.28", features = ["event-stream"] }
futures-util = "0.3"
reqwest = "0.12"
image = "0.25"
base64 = "0.21"
